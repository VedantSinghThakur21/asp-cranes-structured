name: crm

services:
  postgres:
    image: postgres:18
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    env_file:
      - .env.production # Environment variables for production
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crmdb@21}
      POSTGRES_DB: ${POSTGRES_DB:-asp_crm}
    networks:
      - crm_network
    volumes:
      - postgres_data:/var/lib/postgresql
      # Mounting initial schema SQL file for database initialization
      - ./crm-app/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./crm-app/backend
      dockerfile: Dockerfile
      platforms: # distinct computing architectures or platforms
        - linux/amd64 # x86_64 - Intel/AMD
        - linux/arm64 # Apple Silicon
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - ./crm-app/backend/.env.production # Environment variables for production
    environment:
      NODE_ENV: production
    networks:
      - crm_network

  frontend:
    build:
      context: ./crm-app/frontend
      dockerfile: Dockerfile
      platforms: # distinct computing architectures or platforms
        - linux/amd64 # x86_64 - Intel/AMD
        - linux/arm64 # Apple Silicon
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./crm-app/frontend/.env.production # Environment variables for production
    environment:
      NODE_ENV: production
      VITE_API_URL: http://80.225.224.8:3001/api
      VITE_BACKEND_URL: http://80.225.224.8:3001
    networks:
      - crm_network
    depends_on:
      - backend

networks:
  crm_network:
    driver: bridge

volumes:
  postgres_data:
